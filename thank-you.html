<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - TommyCo</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5e6d3;
      color: #4a3728;
      margin: 0;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .logo {
      width: 120px;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .card {
      background-color: #fff8f0;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      text-align: center;

      width: 100%;
      max-width: 500px;
    }

    .card h1 {
      color: #6b4226;
      margin-bottom: 10px;
    }

    .card p {
      color: #7d5133;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .btn {
      display: flex;
      justify-content: center;
      align-items: center;

      width: 100%;
      height: 50px;
      background-color: #6b4226;
      color: #f5e6d3;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
    }

    .btn:hover {
      background-color: #7d5133;
    }
  </style>
</head>

<body>

  <div class="wrapper">
    
    <img src="coffee-bg.jpg.jpg" alt="Logo" class="logo">

    <div class="card">
      <h1>Thank You!</h1>
      <p>
        Your feedback has been successfully submitted.<br>
        We appreciate your time and support ☕
      </p>

      <a href="index.html" class="btn">Go Back to Home</a>
    </div>

  </div>

</body>
</html>
